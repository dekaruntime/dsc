name: CI

on:
  # PRs always run: main requires the "Rust tests" check, and a
  # paths-ignore here would leave docs-only PRs permanently unmergeable.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted only. This repo must never download V8 or link deno_core.
env:
  SCCACHE_ENDPOINT: "https://08b93c93f8b7adc43678e9afba31e4ee.r2.cloudflarestorage.com"
  SCCACHE_REGION: "auto"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    name: Rust tests
    runs-on: [self-hosted, linux, x64]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Where am I
        uses: ./.github/actions/where-am-i

      # rust-toolchain installs rustup if `rustup` is not on PATH. Non-login
      # runner shells often have ~/.cargo/bin missing, then the installer
      # hits static.rust-lang.org and flakes on DNS.
      - name: Cargo bin on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: scripts/ci-configure-sccache.sh

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Verify lockfile
        run: cargo update --workspace --locked

      - name: Test workspace
        run: cargo test --locked --workspace

      # rfd#38: this repo owns tests/tour + tests/testsuite. cargo test
      # already runs fmt corpus + wasm tour; name the gate and refuse an
      # empty tree (the wasm test used to return on a missing manifest).
      - name: Language fixtures
        run: |
          test -f tests/tour/manifest.json
          n=$(find tests/testsuite \( -name '*.pass.ds' -o -name '*.pass.dsx' \) | wc -l)
          test "$n" -gt 100
          cargo test --locked -p deka-fmt --test corpus_roundtrip
          cargo test --locked -p deka_compiler_wasm all_website_tour_sources_match_the_native_abi_contract

      - name: Check wasm32 compiler + diagnostics
        run: |
          cargo check --locked --target wasm32-unknown-unknown -p deka_compiler_wasm
          cargo check --locked --target wasm32-unknown-unknown -p dekascript_lsp_wasm --no-default-features

      - name: Forbid V8 in this repo
        run: |
          if grep -RInE 'deno_core|rusty_v8' \
            --include='Cargo.toml' --include='Cargo.lock' --include='*.rs' \
            crates Cargo.toml Cargo.lock; then
            echo "::error::dsc must not depend on V8 / deno_core"
            exit 1
          fi
