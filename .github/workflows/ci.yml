name: CI

on:
  # PRs always create the required "Rust tests" check. A workflow-level path
  # filter would leave docs-only PRs permanently pending and unmergeable.
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{ steps.classify.outputs.source_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: classify
        name: Detect source-impacting changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          base="$PR_BASE_SHA"
          head="$PR_HEAD_SHA"

          # A new ref has no parent SHA. Run the full gate rather than
          # attempting to classify an incomplete diff.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source_changed=false
          while IFS= read -r path; do
            case "$path" in
              Cargo.toml|Cargo.lock|rust-toolchain|rust-toolchain.toml|build.rs|\
              crates/*|tests/*|scripts/*|.cargo/*|.github/actions/*|.github/workflows/*)
                source_changed=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          echo "source_changed=$source_changed" >> "$GITHUB_OUTPUT"

  rust:
    # Keep this exact required-check name. It always reports, while the
    # expensive steps below run only when source or CI inputs changed.
    name: Rust tests
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: public-ci
    env:
      SCCACHE_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      SCCACHE_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - name: Require successful change classification
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::Could not classify changed files; refusing to skip Rust tests."
          exit 1

      - name: Skip Rust work for non-source changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed != 'true' }}
        run: echo "No source-impacting changes; Rust tests intentionally skipped."

      - uses: actions/checkout@v5
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}

      - name: Where am I
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        uses: ./.github/actions/where-am-i

      - name: Setup Rust
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install sccache
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.SCCACHE_ENDPOINT != '' }}
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$SCCACHE_ENDPOINT" ]; then
            echo "::notice::R2 cache is not configured for this run; building without sccache."
            exit 0
          fi
          if ! command -v sccache >/dev/null 2>&1; then
            echo "::warning::sccache is unavailable; building without a compiler cache."
            exit 0
          fi
          echo "SCCACHE_BUCKET=dsc-sccache-linux-x64" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "sccache enabled for dsc-sccache-linux-x64"

      - name: Cache Rust dependencies
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Verify lockfile
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: cargo update --workspace --locked

      - name: Test workspace
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: cargo test --locked --workspace

      - name: Report sccache statistics
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.SCCACHE_ENDPOINT != '' }}
        run: sccache --show-stats

      # rfd#38: this repo owns tests/tour + tests/testsuite. cargo test
      # already runs fmt corpus + wasm tour; name the gate and refuse an
      # empty tree (the wasm test used to return on a missing manifest).
      - name: Language fixtures
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: |
          test -f tests/tour/manifest.json
          n=$(find tests/testsuite \( -name '*.pass.ds' -o -name '*.pass.dsx' \) | wc -l)
          test "$n" -gt 100
          cargo test --locked -p deka-fmt --test corpus_roundtrip
          cargo test --locked -p deka_compiler_wasm all_website_tour_sources_match_the_native_abi_contract

      - name: Check wasm32 compiler + diagnostics
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: |
          cargo check --locked --target wasm32-unknown-unknown -p deka_compiler_wasm
          cargo check --locked --target wasm32-unknown-unknown -p dekascript_lsp_wasm --no-default-features

      - name: Forbid V8 in this repo
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: |
          if grep -RInE 'deno_core|rusty_v8' \
            --include='Cargo.toml' --include='Cargo.lock' --include='*.rs' \
            crates Cargo.toml Cargo.lock; then
            echo "::error::dsc must not depend on V8 / deno_core"
            exit 1
          fi
