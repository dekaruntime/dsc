name: CI

on:
  # PRs always create the required "Rust tests" check. A workflow-level path
  # filter would leave docs-only PRs permanently pending and unmergeable.
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{ steps.classify.outputs.source_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: classify
        name: Detect source-impacting changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          base="$PR_BASE_SHA"
          head="$PR_HEAD_SHA"

          # A new ref has no parent SHA. Run the full gate rather than
          # attempting to classify an incomplete diff.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source_changed=false
          while IFS= read -r path; do
            case "$path" in
              Cargo.toml|Cargo.lock|rust-toolchain|rust-toolchain.toml|build.rs|\
              crates/*|tests/*|scripts/*|.cargo/*|.github/actions/*|.github/workflows/*)
                source_changed=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          echo "source_changed=$source_changed" >> "$GITHUB_OUTPUT"

  rust:
    # Keep this exact required-check name. It always reports, while the
    # expensive steps below run only when source or CI inputs changed.
    name: Rust tests
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: public-ci
    env:
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - name: Require successful change classification
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::Could not classify changed files; refusing to skip Rust tests."
          exit 1

      - name: Skip Rust work for non-source changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed != 'true' }}
        run: echo "No source-impacting changes; Rust tests intentionally skipped."

      - uses: actions/checkout@v5
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}

      - name: Where am I
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        uses: ./.github/actions/where-am-i

      - name: Setup Rust
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install sccache
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.SCCACHE_ENDPOINT != '' }}
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$SCCACHE_ENDPOINT" ]; then
            echo "::notice::R2 cache is not configured for this run; building without sccache."
            exit 0
          fi
          if ! command -v sccache >/dev/null 2>&1; then
            echo "::warning::sccache is unavailable; building without a compiler cache."
            exit 0
          fi
          echo "SCCACHE_BUCKET=dsc-sccache-linux-x64" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "sccache enabled for dsc-sccache-linux-x64"

      - name: Cache Rust dependencies
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Both fixture sets are owned outside this repo: the Hats corpus by
      # dekaruntime/testsuite and the tour (lessons, manifest, runner) by
      # dekaruntime/tour. Each is fetched through a reviewed checksum pin;
      # workspace tests below read them from .cache/.
      - name: Forbid vendored testsuite corpus
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: |
          if find tests -type d -name testsuite -print -quit | grep -q .; then
            echo "::error::testsuite corpus must not be vendored; use scripts/ci-fetch-testsuite-corpus.sh"
            exit 1
          fi

      - name: Forbid vendored tour
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: |
          if find tests -type d -name tour -print -quit | grep -q .; then
            echo "::error::tour must not be vendored; it is owned by dekaruntime/tour. Use scripts/ci-fetch-tour.sh"
            exit 1
          fi

      - name: Fetch pinned testsuite corpus
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: scripts/ci-fetch-testsuite-corpus.sh "$GITHUB_WORKSPACE/.cache/testsuite-corpus"

      - name: Fetch pinned tour
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: scripts/ci-fetch-tour.sh "$GITHUB_WORKSPACE/.cache/tour"

      - name: Verify lockfile
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: cargo update --workspace --locked

      - name: Test UI runtime JavaScript
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: node --test crates/deka_ui/js/server.test.mjs

      - name: Test workspace
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: cargo test --locked --workspace

      - name: Report sccache statistics
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.SCCACHE_ENDPOINT != '' }}
        run: sccache --show-stats

      - name: Language fixtures
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: |
          test -f .cache/tour/manifest.json
          n=$(find .cache/tour \( -name '*.ds' -o -name '*.dsx' \) | wc -l)
          test "$n" -gt 80
          cargo test --locked -p deka-fmt --test corpus_roundtrip
          cargo test --locked -p deka_compiler_wasm all_website_tour_sources_match_the_native_abi_contract

      # dsc#80: the Hats fixtures only run here if a real `deka run` executes
      # them. dsc cannot build the runtime (V8 stays out of this repo), so the
      # gate downloads the released runtime pinned in
      # scripts/deka-runtime-version and fails the job on any fixture
      # mismatch not listed in the owner corpus's expected-failures.txt (a
      # ratchet, not a suppression list).
      - name: Setup Bun for the testsuite runner
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install pinned deka runtime
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: scripts/ci-install-deka-runtime.sh "$GITHUB_WORKSPACE/.cache/deka-runtime/deka"

      - name: Build dsc for the testsuite gate
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: cargo build --release -p cli

      # The wasm tour test above cannot resolve stdlib packages like `io`, so
      # it skips those lessons. This gate has no such excuse: seed the shared
      # package cache with the pinned deka CLI, then compile every tour
      # lesson — io importers included — with the dsc built from this tree,
      # through the tour owner's own runner. A language change that breaks a
      # lesson fails here.
      - name: Seed tour io package cache
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: scripts/ci-seed-tour-io.sh "$GITHUB_WORKSPACE/.cache/deka-runtime/deka"

      - name: Run the pinned tour against dsc (native)
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        env:
          DSC: ${{ github.workspace }}/target/release/dsc
        run: bun "$GITHUB_WORKSPACE/.cache/tour/run.mjs"

      - name: Testsuite fixtures against the pinned runtime
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        env:
          DEKA_NATIVE: ${{ github.workspace }}/.cache/deka-runtime/deka
          DEKA_DSC: ${{ github.workspace }}/target/release/dsc
        run: bun "$GITHUB_WORKSPACE/.cache/testsuite-corpus/run.mjs"

      - name: Check wasm32 compiler + diagnostics
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: |
          cargo check --locked --target wasm32-unknown-unknown -p deka_compiler_wasm
          cargo check --locked --target wasm32-unknown-unknown -p dekascript_lsp_wasm --no-default-features

      - name: Forbid V8 in this repo
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: |
          if grep -RInE 'deno_core|rusty_v8' \
            --include='Cargo.toml' --include='Cargo.lock' --include='*.rs' \
            crates Cargo.toml Cargo.lock; then
            echo "::error::dsc must not depend on V8 / deno_core"
            exit 1
          fi

      # Folded in from the standalone rust-clippy analyze workflow: same
      # toolchain (stable) and same flags (--all-features). Runs last because
      # it switches the default toolchain away from the pinned 1.96.0.
      - name: Setup Rust (stable) for clippy
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.source_changed == 'true' }}
        run: cargo clippy --all-features
