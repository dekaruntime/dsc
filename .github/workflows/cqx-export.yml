name: cqx

# What this repository scores, and what the explorer shows.
#
# Two jobs, because they answer different questions. A pull request wants a
# number and a direction, which needs no credentials and nothing published. A
# push to main wants the commit browsable at explorer.deka.gg, which is the only
# case worth keeping.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMMITS: 5

jobs:
  # ---------------------------------------------------------------------------
  report:
    name: score
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # So each finding lands on its own line in Files changed, rather than in
      # a comment that grows on every push.
      security-events: write
    steps:
      # Deep enough to reach the base of the pull request without a second
      # fetch: that is what turns a score into a direction.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: samifouad/cqx-action@v1
        with:
          # Reporting only, to begin with. dsc's score moves every day and a
          # gate that fails the author teaches the author to turn it off.
          # Flip this to true once the numbers settle.
          fail: 'false'

  # ---------------------------------------------------------------------------
  publish:
    name: publish to the explorer
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Where the bucket credentials live. They are scoped to the cqx bucket and
    # to nothing else.
    environment: release
    # One publisher at a time: two runs writing one index would race over which
    # timeline is current, and the loser would not know.
    concurrency:
      group: cqx-publish
      cancel-in-progress: false
    env:
      BUCKET: cqx
      AWS_ACCESS_KEY_ID: ${{ secrets.CQX_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CQX_R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT: ${{ secrets.CQX_R2_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
    steps:
      # Deep enough that a first-parent walk of five commits cannot run out of
      # history on a branch that merges often.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60

      # The installer picks the binary for this runner and checks it against
      # the sums published beside it. Naming the asset here is what broke: the
      # release renamed cqx-linux-x86_64 to cqx-linux-x64 and this went on
      # asking for a file that no longer exists.
      - name: Install cqx
        run: |
          set -euo pipefail
          export CQX_INSTALL_DIR="${RUNNER_TEMP}/cqx" CQX_NO_MODIFY_PATH=1
          curl -fsSL https://cqx.bio/install | sh
          echo "${CQX_INSTALL_DIR}/bin" >> "$GITHUB_PATH"

      # A dataset names its commit and describes nothing else, which makes it
      # immutable — written once, cached forever, never analysed twice. Taking
      # down the ones the bucket already has is what turns "the last five
      # commits" into "the one that is new".
      - name: Take down what the bucket already has
        run: |
          mkdir -p "out/${{ github.repository }}"
          : > have.txt
          for sha in $(git rev-list --first-parent -n "$COMMITS" HEAD | cut -c1-8); do
            if aws s3 cp "s3://$BUCKET/${{ github.repository }}/$sha.json" \
                 "out/${{ github.repository }}/$sha.json" \
                 --endpoint-url="$AWS_ENDPOINT" --only-show-errors 2>/dev/null; then
              echo "$sha.json" >> have.txt
              echo "have $sha"
            else
              echo "need $sha"
            fi
          done

      - name: Export
        run: cqx export . --commits "$COMMITS" --name "${{ github.repository }}" --out out

      - name: Put back what is new
        run: |
          for path in out/${{ github.repository }}/*.json; do
            name=$(basename "$path")
            # The index is the one file that changes, so it always goes up.
            if [ "$name" != "index.json" ] && grep -qxF "$name" have.txt; then
              echo "unchanged $name"
              continue
            fi
            aws s3 cp "$path" "s3://$BUCKET/${{ github.repository }}/$name" \
              --endpoint-url="$AWS_ENDPOINT" \
              --content-type application/json --only-show-errors
            echo "published $name"
          done

      - name: Say what is live
        run: |
          {
            echo "[explorer.deka.gg/${{ github.repository }}](https://explorer.deka.gg/${{ github.repository }})"
            echo
            python3 - <<'PY'
          import json
          index = json.load(open('out/${{ github.repository }}/index.json'))
          categories = list(index['commits'][0]['scores'])
          print('| commit | subject | ' + ' | '.join(categories) + ' |')
          print('|---|---|' + '---|' * len(categories))
          for commit in reversed(index['commits']):
              scores = ' | '.join(str(commit['scores'][c]) for c in categories)
              print(f"| `{commit['short']}` | {commit['subject'][:48]} | {scores} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
