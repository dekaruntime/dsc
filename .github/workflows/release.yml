# SCCACHE IS REQUIRED FOR ALL RUST COMPILATION.
# EVERY CARGO BUILD/TEST/CHECK MUST RUN WITH RUSTC_WRAPPER=sccache. NO EXCEPTIONS.

# rfd#68: this workflow builds and publishes CANARY releases only. It never
# creates a stable vX.Y.Z tag or touches the latest/ pointers — that is
# promote.yml's job, run by a human against a canary this workflow already
# built and published. There is no "test" job here: PR CI (ci.yml) already
# ran the unit-test gate on this exact merge commit before it reached main;
# re-running it here bought nothing but latency.
name: Release (canary)

on:
  # tag-canary.yml dispatches this explicitly (see that file for why a plain
  # tag push can't trigger it directly).
  workflow_dispatch: {}
  # Belt-and-suspenders: if a canary tag is ever pushed with a real user
  # token (not GITHUB_TOKEN), build it too. Plain vX.Y.Z tags are excluded by
  # this filter; promote.yml is what creates those.
  push:
    tags:
      - 'v*-canary-*'

permissions:
  contents: read

env:
  R2_BUCKET_RELEASES: "dsc-releases"
  R2_BUCKET_WASM: "dsc-wasm"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  resolve:
    name: Resolve canary ref
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      base_version: ${{ steps.resolve.outputs.base_version }}
      sha7: ${{ steps.resolve.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Resolve and validate the canary ref
        id: resolve
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} is a stable tag. Stable tags are created by promote.yml, not by running release.yml."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-canary-([0-9a-f]{7})$ ]]; then
            echo "::error::${TAG} is not a canary ref. Expected vX.Y.Z-canary-<7-char-sha>."
            exit 1
          fi

          BASE_VERSION="${BASH_REMATCH[1]}"
          SHA7="${BASH_REMATCH[2]}"
          VERSION="${TAG#v}"

          TREE_VERSION="$(scripts/dsc-version.sh)"
          if [ "$BASE_VERSION" != "$TREE_VERSION" ]; then
            echo "::error::${TAG} names base version ${BASE_VERSION} but the workspace at this commit is ${TREE_VERSION}."
            exit 1
          fi

          COMMIT_SHA7="$(git rev-parse --short=7 HEAD)"
          if [ "$SHA7" != "$COMMIT_SHA7" ]; then
            echo "::error::${TAG} names commit ${SHA7} but HEAD at this ref is ${COMMIT_SHA7}."
            exit 1
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "base_version=${BASE_VERSION}"
            echo "sha7=${SHA7}"
          } >> "$GITHUB_OUTPUT"

  build-wasm:
    name: Build browser compiler + diagnostics WASM
    needs: [resolve]
    runs-on: ubuntu-latest
    environment: release
    env:
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: dsc-sccache-linux-x64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach R2
        run: |
          command -v aws >/dev/null 2>&1 || pip install --break-system-packages awscli
          echo "SCCACHE_ENDPOINT=$SCCACHE_ENDPOINT"
          echo "SCCACHE_BUCKET=$SCCACHE_BUCKET"
          sccache --show-stats
          aws s3 ls "s3://${SCCACHE_BUCKET}/" --endpoint-url="${SCCACHE_ENDPOINT}"

      - name: Build WASM artifacts
        env:
          RUSTC_WRAPPER: sccache
          # deka_compiler_metadata() reads this via option_env! at compile time.
          # Without it SOURCE_COMMIT falls back to the literal string "unknown",
          # which testsuite.deka.gg then renders as "@unknown" beside the version.
          DEKA_SOURCE_COMMIT: ${{ github.sha }}
        run: scripts/build-wasm.sh dist/wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsc-wasm
          path: dist/wasm/*
          retention-days: 1

  build-cli:
    name: Build CLI (${{ matrix.platform }})
    needs: [resolve]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            sccache_bucket: dsc-sccache-linux-x64
          - platform: darwin-x64
            runner: macos-15-intel
            sccache_bucket: dsc-sccache-darwin-x64
          - platform: darwin-arm64
            runner: macos-14
            sccache_bucket: dsc-sccache-darwin-arm64
    runs-on: ${{ matrix.runner }}
    environment: release
    env:
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: ${{ matrix.sccache_bucket }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach R2
        run: |
          command -v aws >/dev/null 2>&1 || pip install --break-system-packages awscli
          echo "SCCACHE_ENDPOINT=$SCCACHE_ENDPOINT"
          echo "SCCACHE_BUCKET=$SCCACHE_BUCKET"
          sccache --show-stats
          aws s3 ls "s3://${SCCACHE_BUCKET}/" --endpoint-url="${SCCACHE_ENDPOINT}"

      - name: Build CLI
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --locked --release -p cli

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp target/release/dsc "dist/dsc-${{ matrix.platform }}"
          chmod +x "dist/dsc-${{ matrix.platform }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: dsc-cli-${{ matrix.platform }}
          path: dist/dsc-${{ matrix.platform }}
          retention-days: 1

  smoke:
    name: Smoke test CLI (${{ matrix.platform }})
    needs: [resolve, build-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: dsc-cli-${{ matrix.platform }}
          path: dist

      - name: dsc --version and dsc check smoke test
        run: |
          set -euo pipefail

          BASE_VERSION="${{ needs.resolve.outputs.base_version }}"
          BIN="$PWD/dist/dsc-${{ matrix.platform }}"
          chmod +x "$BIN"

          # dsc --version prints to stderr, not stdout (create-deka-app's
          # sync.js hit the same bug) — capture both streams or VERSION_OUT
          # is always empty and this check passes/fails on nothing.
          VERSION_OUT="$("$BIN" --version 2>&1)"
          echo "$VERSION_OUT"
          case "$VERSION_OUT" in
            *"$BASE_VERSION"*) ;;
            *)
              echo "::error::dsc --version did not print ${BASE_VERSION}: ${VERSION_OUT}"
              exit 1
              ;;
          esac

          # Judge dsc check by exit code, not by its output (which may also
          # land on stderr) — the same lesson as above.
          printf 'const x = 1 + 1\n' > valid.ds
          if ! "$BIN" check --single-file valid.ds >valid.out 2>&1; then
            echo "::error::dsc check rejected valid input: $(cat valid.out)"
            exit 1
          fi

          printf 'const x = 1 +\n' > invalid.ds
          if "$BIN" check --single-file invalid.ds >invalid.out 2>&1; then
            echo "::error::dsc check accepted invalid input: $(cat invalid.out)"
            exit 1
          fi

  publish:
    name: Publish
    needs: [resolve, build-wasm, smoke]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v5

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dsc-*

      - name: Prepare release layout
        id: prepare
        run: |
          set -euo pipefail

          VERSION="${{ needs.resolve.outputs.version }}"
          TAG="${{ needs.resolve.outputs.tag }}"
          BASE_VERSION="${{ needs.resolve.outputs.base_version }}"
          COMMIT="${GITHUB_SHA}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mkdir -p "release/${VERSION}"
          for platform in linux-x64 darwin-x64 darwin-arm64; do
            cp "artifacts/dsc-cli-${platform}/dsc-${platform}" "release/${VERSION}/dsc-${platform}"
            chmod +x "release/${VERSION}/dsc-${platform}"
          done
          cp artifacts/dsc-wasm/dsc.wasm "release/${VERSION}/"
          cp artifacts/dsc-wasm/dsc_diagnostics.wasm "release/${VERSION}/"
          cp artifacts/dsc-wasm/manifest.json "release/${VERSION}/"
          cp artifacts/dsc-wasm/*.sha256 "release/${VERSION}/" 2>/dev/null || true

          sha256() { sha256sum "$1" | awk '{print $1}'; }
          LINUX_X64_SHA256="$(sha256 "release/${VERSION}/dsc-linux-x64")"
          DARWIN_X64_SHA256="$(sha256 "release/${VERSION}/dsc-darwin-x64")"
          DARWIN_ARM64_SHA256="$(sha256 "release/${VERSION}/dsc-darwin-arm64")"
          COMPILER_SHA256="$(sha256 "release/${VERSION}/dsc.wasm")"
          DIAGNOSTICS_SHA256="$(sha256 "release/${VERSION}/dsc_diagnostics.wasm")"
          CARGO_LOCK_SHA256="$(sha256sum Cargo.lock | awk '{print $1}')"

          # channel/base_version/promoted_from are the only new keys; every
          # key release.json already had (version, tag, commit, ...) stays,
          # with `version` carrying the full canary string as it always has
          # carried the tag-derived version.
          cat > "release/${VERSION}/release.json" <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "commit": "${COMMIT}",
            "channel": "canary",
            "base_version": "${BASE_VERSION}",
            "promoted_from": null,
            "published_at": "${PUBLISHED_AT}",
            "cargo_lock_sha256": "${CARGO_LOCK_SHA256}",
            "binaries": {
              "linux-x64": {"name": "dsc-linux-x64", "sha256": "${LINUX_X64_SHA256}"},
              "darwin-x64": {"name": "dsc-darwin-x64", "sha256": "${DARWIN_X64_SHA256}"},
              "darwin-arm64": {"name": "dsc-darwin-arm64", "sha256": "${DARWIN_ARM64_SHA256}"}
            },
            "wasm": {
              "compiler": "dsc.wasm",
              "compiler_sha256": "${COMPILER_SHA256}",
              "diagnostics": "dsc_diagnostics.wasm",
              "diagnostics_sha256": "${DIAGNOSTICS_SHA256}"
            }
          }
          EOF
          python3 -m json.tool "release/${VERSION}/release.json" > "release/${VERSION}/release.json.tmp"
          mv "release/${VERSION}/release.json.tmp" "release/${VERSION}/release.json"

          # manifest.json comes out of build-wasm.sh with no channel
          # awareness (it's also used outside of CI). Stamp the same three
          # keys onto it here, where channel identity actually lives.
          python3 - "release/${VERSION}/manifest.json" "canary" "${BASE_VERSION}" <<'PY'
          import json
          import sys

          path, channel, base_version = sys.argv[1:4]
          with open(path) as f:
              data = json.load(f)
          data["channel"] = channel
          data["base_version"] = base_version
          data["promoted_from"] = None
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          COMPILER_SIZE="$(stat -c%s "release/${VERSION}/dsc.wasm")"
          DIAGNOSTICS_SIZE="$(stat -c%s "release/${VERSION}/dsc_diagnostics.wasm")"
          cp "release/${VERSION}/dsc.wasm" "release/${VERSION}/deka_compiler.wasm"
          cp "release/${VERSION}/dsc_diagnostics.wasm" "release/${VERSION}/deka_diagnostics.wasm"

          python3 scripts/write-browser-artifacts.py \
            "$VERSION" "$COMMIT" "$CARGO_LOCK_SHA256" \
            "$COMPILER_SHA256" "$COMPILER_SIZE" \
            "$DIAGNOSTICS_SHA256" "$DIAGNOSTICS_SIZE" \
            "release/${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Require R2 release credentials
        run: |
          if [ -z "${R2_ENDPOINT:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::release requires R2_ENDPOINT, R2_ACCESS_KEY_ID, and R2_SECRET_ACCESS_KEY in the release environment."
            exit 1
          fi

      - name: Install AWS CLI
        run: command -v aws >/dev/null 2>&1 || pip install --break-system-packages awscli

      - name: Upload versioned canary release to R2
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          aws s3 sync "release/${VERSION}/" "s3://${R2_BUCKET_RELEASES}/v${VERSION}/" --endpoint-url="${R2_ENDPOINT}"

      - name: Upload versioned canary WASM to R2
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          for f in dsc.wasm dsc_diagnostics.wasm deka_compiler.wasm deka_diagnostics.wasm \
            dsc-linux-x64 dsc-darwin-x64 dsc-darwin-arm64 \
            manifest.json release.json deka-compiler-artifact.json deka-diagnostics-artifact.json; do
            aws s3 cp "release/${VERSION}/${f}" "s3://${R2_BUCKET_WASM}/v${VERSION}/${f}" --endpoint-url="${R2_ENDPOINT}"
          done

      - name: Create GitHub release (prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          TMPDIR="$(mktemp -d)"
          curl -fsSL -o "${TMPDIR}/gh.tar.gz" \
            "https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz"
          tar -xzf "${TMPDIR}/gh.tar.gz" -C "${TMPDIR}"
          GH_BIN="${TMPDIR}/gh_2.98.0_linux_amd64/bin/gh"

          ASSETS=()
          for f in release/${VERSION}/*; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          TITLE="dsc ${VERSION} (canary)"
          NOTES="dsc ${VERSION} canary build. Untested until promoted; see PUBLISH.md."
          if "$GH_BIN" release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists. Uploading/overwriting assets."
            "$GH_BIN" release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" \
              --repo "${{ github.repository }}" --clobber
          else
            "$GH_BIN" release create "${GITHUB_REF_NAME}" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              "${ASSETS[@]}"
          fi

      - name: Publish canary pointers
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          aws s3 cp "release/${VERSION}/release.json" "s3://${R2_BUCKET_RELEASES}/canary/release.json" --endpoint-url="${R2_ENDPOINT}"
          for f in dsc.wasm dsc_diagnostics.wasm deka_compiler.wasm deka_diagnostics.wasm \
            manifest.json release.json deka-compiler-artifact.json deka-diagnostics-artifact.json \
            dsc-linux-x64 dsc-darwin-x64 dsc-darwin-arm64; do
            aws s3 cp "release/${VERSION}/${f}" "s3://${R2_BUCKET_WASM}/canary/${f}" --endpoint-url="${R2_ENDPOINT}"
          done

      - name: Summary
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          echo "Published dsc ${VERSION} (canary) to GitHub Releases."
          echo "  wasm host: https://dsc-wasm.deka.gg/v${VERSION}/dsc.wasm"
          echo "  canary pointer: https://dsc-wasm.deka.gg/canary/dsc.wasm"
          echo "  CLI: https://dsc-wasm.deka.gg/v${VERSION}/dsc-darwin-arm64"
          echo "  latest/ was NOT touched. Promote via Actions -> promote.yml."

  # ------------------------------------------------------------------
  # create-deka-app republishes released dsc binaries as the
  # @dekaruntime/dsc-* npm packages. It also checks hourly, so this only
  # removes latency and skips cleanly when the token is absent.
  # ------------------------------------------------------------------
  notify:
    name: Notify downstream
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger npm package publish
        env:
          GH_TOKEN: ${{ secrets.CASCADE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CASCADE_DISPATCH_TOKEN is not visible to this repo (org secret → Repository access). The npm publish for this release was NOT triggered; create-deka-app's hourly schedule will publish it within the hour, but fix the secret."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          curl -sSL --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dekaruntime/create-deka-app/dispatches \
            -d "{\"event_type\":\"dsc-released\",\"client_payload\":{\"tag\":\"$TAG\",\"channel\":\"canary\"}}"
