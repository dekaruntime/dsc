[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/stdio",
    "crates/cli",
    "crates/deka_syntax",
    "crates/deka_compile",
    "crates/deka-fmt",
    "crates/deka_lsp",
    "crates/deka-validation",
    "crates/deka_compiler_wasm",
    "crates/deka_lsp_wasm",
    "crates/deka_emit",
    "crates/deka_project",
    "crates/deka_ui",
    "crates/bundler",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }
