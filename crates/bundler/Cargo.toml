[package]
name = "bundler"
version.workspace = true
edition.workspace = true
description = "SWC module bundler for dsc transpile --bundle / --treeshake"
license.workspace = true

[dependencies]
anyhow = "1.0"
base64 = "0.22"
lightningcss = { version = "1.0.0-alpha.68", features = ["bundler"] }
mime_guess = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.11"
sha2 = "0.10"
swc_bundler = "56.0.1"
swc_common = "26.0.0"
swc_ecma_ast = "29.0.1"
swc_ecma_codegen = "32.0.1"
swc_ecma_loader = "27.0.0"
swc_ecma_parser = { version = "45.1.3", features = ["typescript"] }
swc_ecma_transforms_base = "49.0.1"
swc_ecma_transforms_typescript = "55.0.3"
swc_ecma_minifier = "61.0.7"
swc_atoms = "10.0.0"
swc_ecma_visit = "29.0.0"
stdio = { path = "../stdio" }
deka_project = { path = "../deka_project" }
deka_ui = { path = "../deka_ui" }

[dev-dependencies]
tempfile = "3.27"
