[package]
name = "bundler"
version.workspace = true
edition.workspace = true
description = "SWC module bundler for dsc transpile --bundle / --treeshake"
license.workspace = true

[dependencies]
anyhow = "1.0"
base64 = "0.22"
lightningcss = { version = "1.0.0-alpha.68", features = ["bundler"] }
mime_guess = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.10"
sha2 = "0.10"
swc_bundler = "39.0.0"
swc_common = "18.0.1"
swc_ecma_ast = "19.0.0"
swc_ecma_codegen = "21.0.0"
swc_ecma_loader = "18.0.0"
swc_ecma_parser = { version = "31.0.0", features = ["typescript"] }
swc_ecma_transforms_base = "34.0.0"
swc_ecma_transforms_typescript = "37.0.0"
swc_ecma_minifier = "42.0.0"
swc_atoms = "9.0.0"
swc_ecma_visit = "19.0.0"
stdio = { path = "../stdio" }
deka_project = { path = "../deka_project" }
deka_ui = { path = "../deka_ui" }

[dev-dependencies]
tempfile = "3.27"
