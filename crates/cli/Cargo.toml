[package]
name = "cli"
version.workspace = true
edition.workspace = true
description = "dsc command-line interface"
license.workspace = true

[[bin]]
name = "dsc"
path = "src/main.rs"

[dependencies]
core = { path = "../core" }
stdio = { path = "../stdio" }
deka_compile = { path = "../deka_compile" }
deka_syntax = { path = "../deka_syntax" }
deka_project = { path = "../deka_project" }
bundler = { path = "../bundler" }
deka-fmt = { path = "../deka-fmt" }
deka-validation = "0.2"
dekascript_lsp = { path = "../deka_lsp" }
bumpalo = { version = "3.16", features = ["collections"] }
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3.14"
tokio = { workspace = true }
