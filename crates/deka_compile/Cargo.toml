[package]
name = "deka_compile"
version.workspace = true
edition = "2021"
description = "DekaScript compiler orchestrator (Compiler v2)"
license = "Apache-2.0"

[dependencies]
deka_syntax = { path = "../deka_syntax" }
deka_emit = { path = "../deka_emit" }
deka_project = { path = "../deka_project" }
bumpalo = "3.16"
serde = { workspace = true }
serde_json = { workspace = true }

swc_common = "18.0.1"
swc_ecma_ast = "19.0.0"
swc_ecma_parser = { version = "31.0.0", default-features = false, features = ["typescript"] }
swc_ecma_visit = "19.0.0"

[dev-dependencies]
insta = "1.40"
tempfile = "3.14"
