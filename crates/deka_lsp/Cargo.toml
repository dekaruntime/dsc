[package]
name = "dekascript_lsp"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
default = ["native"]
native = ["dep:anyhow", "dep:tokio", "dep:tower-lsp"]

[dependencies]
tower-lsp = { version = "0.20", optional = true }
tokio = { workspace = true, optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
anyhow = { version = "1", optional = true }
deka_compile = { path = "../deka_compile" }
deka_syntax = { path = "../deka_syntax" }
